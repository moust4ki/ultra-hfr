name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coeur:
    name: Tests du cœur (UltraHFRKit)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode le plus récent
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Tests
        working-directory: Packages/UltraHFRKit
        run: swift test

  app:
    name: Tests de l'app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode le plus récent
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Simulateur iPhone
        id: simulateur
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if "iOS" in k), reverse=True)
          print(next(d["udid"] for k in runtimes for d in devices[k] if d["name"].startswith("iPhone")))
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Compilation et tests
        run: |
          xcodebuild -project UltraHFR.xcodeproj -scheme UltraHFR \
            -destination "id=${{ steps.simulateur.outputs.udid }}" \
            -only-testing:UltraHFRTests \
            CODE_SIGNING_ALLOWED=NO test
