# Description du projet Xcode. Après modification : `xcodegen generate`.
# Le .xcodeproj généré est versionné : XcodeGen n'est utile que pour changer les cibles.
name: UltraHFR
options:
  bundleIdPrefix: com.yendicohen
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: fr
  xcodeVersion: "27.1"
  groupSortPosition: top
configFiles:
  Debug: Config/UltraHFR.xcconfig
  Release: Config/UltraHFR.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ENABLE_MODULE_VERIFIER: YES
packages:
  UltraHFRKit:
    path: Packages/UltraHFRKit
targets:
  UltraHFR:
    type: application
    platform: iOS
    sources:
      - path: UltraHFR
        type: syncedFolder
    dependencies:
      - package: UltraHFRKit
        product: HFRKit
      - package: UltraHFRKit
        product: HFRContent
      - package: UltraHFRKit
        product: HFRReader
    settings:
      base:
        PRODUCT_NAME: UltraHFR
        PRODUCT_BUNDLE_IDENTIFIER: $(ULTRAHFR_BUNDLE_ID)
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ultra HFR
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets:
        - package: UltraHFRKit/HFRKitTests
        - package: UltraHFRKit/HFRContentTests
        - package: UltraHFRKit/HFRReaderTests
      gatherCoverageData: true
